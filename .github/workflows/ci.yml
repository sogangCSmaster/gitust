name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and rehearse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.92.0
          rustc --version
          cargo --version

      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap curl

      - name: Require an executable OS sandbox
        run: |
          test -d "$HOME/.rustup"
          case "$RUNNER_OS" in
            Linux)
              /usr/bin/bwrap --die-with-parent --new-session --unshare-all \
                --ro-bind / / --dev /dev --proc /proc /bin/true
              ;;
            macOS)
              /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
              ;;
            *) printf 'Unsupported sandbox platform: %s\n' "$RUNNER_OS" >&2; exit 1 ;;
          esac

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked

      - name: Build and check the committed web bundle
        run: |
          pnpm --filter @gitust/design-system build
          if [[ -n "$(git status --porcelain --untracked-files=all -- packages/design-system/dist)" ]]; then
            printf 'The committed web bundle differs from the production build.\n' >&2
            exit 1
          fi

      - name: Run every mechanical gate
        run: scripts/verify.sh

      - name: Run the real ten-task operating rehearsal
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            printf 'The source checkout changed during verification; refusing rehearsal.\n' >&2
            git status --short --untracked-files=all
            exit 1
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          cargo build --locked -p gitust-cli
          # PR checkouts are detached. Give the local fixture the exact tested commit.
          if [[ "$(git symbolic-ref --quiet --short HEAD || true)" != main ]]; then
            git branch --force main HEAD
          fi
          test "$(git rev-parse refs/heads/main)" = "$(git rev-parse HEAD)"
          python3 scripts/alpha-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-alpha-rehearsal.json"

      - name: Record only public rehearsal evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          report_path = Path(os.environ["RUNNER_TEMP"]) / "gitust-alpha-rehearsal.json"
          report = json.loads(report_path.read_text())
          expected_backend = {"Linux": "linux_bubblewrap", "macOS": "macos_seatbelt"}[os.environ["RUNNER_OS"]]
          expected_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if report["source_commit"] != expected_commit:
              raise SystemExit("The rehearsal used a different source revision")
          if report["runtime_worktree_dirty"] is not False:
              raise SystemExit("The runtime source differs from the tested commit")
          if report["sandbox_backends"] != [expected_backend]:
              raise SystemExit("The rehearsal did not execute the required OS sandbox")
          if report["registered_repository_acl_and_restore"] is not True:
              raise SystemExit("The rehearsal did not verify registered repository access and restore")
          if (len(report["tasks"]) != 10
              or {task["task"] for task in report["tasks"]} != set(range(1, 11))
              or not all(task["passed"] is True for task in report["tasks"])):
              raise SystemExit("The ten-task rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "sandbox_backends", "mcp_clients", "external_github_publication", "git_fsck",
                    "registered_repository_acl_and_restore"]}
          public["completed_tasks"] = len(report["tasks"])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Real operating rehearsal\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify two real repositories and startup rollback
        run: |
          python3 scripts/multi-repository-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-multi-repository.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-multi-repository.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected_platform = {"Linux": "Linux", "macOS": "Darwin"}[os.environ["RUNNER_OS"]]
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["platform"] != expected_platform or report["actual_repositories"] != 2
              or report["external_github_publication"] is not False):
              raise SystemExit("The multi-repository rehearsal has invalid source or scope evidence")
          checks = ["passed", "team_filtered_catalog", "independent_git_read_oracles",
                    "imported_registered_secondary",
                    "renamed_registered_repositories",
                    "primary_only_mutations", "revoked_and_deactivated_denied",
                    "restart_identity_preserved", "partial_startup_locks_released",
                    "duplicate_repository_rejected", "git_fsck"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The multi-repository rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Two real repositories\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify empty repository creation and first push
        run: |
          python3 scripts/empty-repository-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-empty-repository.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-empty-repository.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          platform = {"Linux": "Linux", "macOS": "Darwin"}[os.environ["RUNNER_OS"]]
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["platform"] != platform or report["actual_repositories"] != 2
              or report["external_github_publication"] is not False):
              raise SystemExit("The empty-repository rehearsal has invalid source or scope evidence")
          checks = ["passed", "cli_created_registered_bare_repositories", "empty_retry_preserved_pair",
                    "unborn_registration_restored_without_original",
                    "unborn_default_did_not_hide_other_branches", "first_ordinary_push_and_fetch",
                    "independent_git_read_oracles", "secondary_push_denied",
                    "populated_retry_rejected_unchanged", "restart_identity_preserved", "git_fsck",
                    "uuid_branch_pages_match_git", "unborn_default_exposes_existing_branches",
                    "secondary_branch_reads", "max_cursor_http_round_trip"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The empty-repository rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Empty creation and first push\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Restore all repositories from one stopped checkpoint
        run: |
          python3 scripts/multi-repository-backup-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-multi-backup.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-multi-backup.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          platform = {"Linux": "Linux", "macOS": "Darwin"}[os.environ["RUNNER_OS"]]
          digest = hashlib.sha256()
          with Path("target/debug/gitust").open("rb") as binary:
              for block in iter(lambda: binary.read(1024 * 1024), b""):
                  digest.update(block)
          if (report["source_commit"] != expected or report["source_worktree_dirty"] is not False
              or report["binary_sha256"] != digest.hexdigest() or report["platform"] != platform
              or report["repository_count"] != 2 or report["external_github_tested"] is not False):
              raise SystemExit("The multi-backup rehearsal has invalid source or scope evidence")
          checks = ["passed", "all_sources_unavailable", "repository_ids_preserved",
                    "catalog_and_team_acl", "secondary_writes_denied", "refs_and_git_fsck",
                    "worktree_records_preserved", "pending_requires_fresh_verification",
                    "single_auth_checkpoint"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The multi-backup rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "repository_count", "external_github_tested", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### All-repository stopped restoration\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify default branch management and clone behavior
        run: |
          python3 scripts/default-branch-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-default-branch.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-default-branch.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          backend = {"Linux": "linux_bubblewrap", "macOS": "macos_seatbelt"}[os.environ["RUNNER_OS"]]
          binary_sha = hashlib.sha256(Path("target/debug/gitust").read_bytes()).hexdigest()
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["binary_sha256"] != binary_sha or report["actual_repositories"] != 2
              or report["sandbox_backends"] != [backend] or report["external_github_publication"] is not False):
              raise SystemExit("The default-branch rehearsal has invalid source or scope evidence")
          checks = ["passed", "default_head_only_changed", "registered_identity_preserved",
                    "denied_and_stale_requests_unchanged", "read_only_git_state_preserved",
                    "existing_task_target_preserved", "omitted_base_uses_current_default",
                    "restart_default_preserved", "git_http_advertises_default",
                    "fresh_clone_uses_default", "existing_clone_fetch_matches_git", "git_fsck",
                    "owned_services_reaped", "private_fixture_removed"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The default-branch rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "sandbox_backends", "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Default branch management\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify repository access scope and relocated recovery
        run: |
          python3 scripts/repository-visibility-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-repository-visibility.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-repository-visibility.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          backend = {"Linux": "linux_bubblewrap", "macOS": "macos_seatbelt"}[os.environ["RUNNER_OS"]]
          binary_sha = hashlib.sha256(Path("target/debug/gitust").read_bytes()).hexdigest()
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["binary_sha256"] != binary_sha or report["actual_repositories"] != 2
              or report["sandbox_backends"] != [backend] or report["external_github_publication"] is not False):
              raise SystemExit("The repository visibility rehearsal has invalid source or scope evidence")
          checks = ["passed", "strict_current_value_cas", "role_and_anonymous_denials",
                    "current_team_and_signed_in_scope", "primary_and_secondary_metadata",
                    "outside_team_git_clone_fetch_and_revoke", "refs_and_task_records_preserved",
                    "restored_scope_and_access", "all_original_paths_unavailable",
                    "pending_requires_fresh_verification", "git_fsck",
                    "owned_services_reaped", "private_fixture_removed"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The repository visibility rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "sandbox_backends", "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Repository access scope\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify read-only secondary Git clone and fetch
        run: |
          python3 scripts/read-only-git-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-read-only-git.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-read-only-git.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          binary_sha = hashlib.sha256(Path("target/debug/gitust").read_bytes()).hexdigest()
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["binary_sha256"] != binary_sha or report["actual_repositories"] != 2
              or report["external_github_publication"] is not False):
              raise SystemExit("The read-only Git rehearsal has invalid source or scope evidence")
          checks = ["passed", "primary_and_secondary_clone_match_git", "session_and_basic_pat_auth",
                    "secondary_push_denied", "annotated_tag_objects_preserved",
                    "current_private_and_shared_acl", "outside_team_revoked_fetch_denied",
                    "unknown_or_unconfigured_denied", "offline_update_fetch_and_restart",
                    "registered_identity_preserved", "primary_refs_unchanged",
                    "revoked_and_deactivated_denied", "git_fsck",
                    "owned_services_reaped", "private_fixture_removed"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The read-only Git rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Read-only secondary Git\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify opted-in secondary ordinary Git pushes and authority boundaries
        run: |
          python3 scripts/secondary-git-write-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-secondary-git-write.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-secondary-git-write.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          binary_sha = hashlib.sha256(Path("target/debug/gitust").read_bytes()).hexdigest()
          platform = {"Linux": "Linux", "macOS": "Darwin"}[os.environ["RUNNER_OS"]]
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["binary_sha256"] != binary_sha or report["actual_repositories"] != 3
              or report["platform"] != platform or report["external_github_publication"] is not False
              or report["version"] != 1):
              raise SystemExit("The secondary Git-write rehearsal has invalid source or scope evidence")
          checks = ["passed", "admin_and_maintainer_session_basic_pat_round_trips",
                    "independent_clone_fetch_commit_tag_oracles", "read_only_secondary_push_denied",
                    "developer_and_wrong_team_denied", "anonymous_mcp_revoked_inactive_denied",
                    "agent_and_mixed_pushes_preserve_refs", "secondary_workbench_denied",
                    "current_catalog_push_hints", "configured_restart_write_and_uuid_preserved",
                    "old_read_only_flag_push_denied", "primary_refs_worktrees_jobs_preserved",
                    "registered_identity_and_preexisting_tags_preserved", "git_fsck",
                    "owned_services_reaped", "private_fixture_removed"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The secondary Git-write rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Opted-in secondary ordinary Git\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Verify owning-group invitations, membership and real repository access
        run: |
          python3 scripts/repository-group-invite-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-group-invite.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-group-invite.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          binary_sha = hashlib.sha256(Path("target/debug/gitust").read_bytes()).hexdigest()
          platform = {"Linux": "Linux", "macOS": "Darwin"}[os.environ["RUNNER_OS"]]
          if (report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False
              or report["binary_sha256"] != binary_sha or report["actual_repositories"] != 3
              or report["platform"] != platform or report["external_github_publication"] is not False
              or report["version"] != 2):
              raise SystemExit("The group invitation rehearsal has invalid source or scope evidence")
          checks = ["passed", "role_anonymous_and_malformed_denials", "one_key_concurrent_issuance",
                    "hash_only_token_and_72_hour_expiry", "exact_origin_and_semantic_conflicts",
                    "restart_replay_preserves_identity", "consumed_and_revoked_keys_do_not_remint",
                    "new_member_sees_exact_group_pair", "other_group_and_account_only_denied",
                    "existing_member_group_grant_and_removal", "membership_version_replay_and_restart",
                    "membership_preserves_other_groups_role_and_status", "membership_real_git_access_revocation",
                    "actual_secondary_clone_fetch_and_tags", "secondary_push_and_worktrees_denied",
                    "revoked_admin_and_deactivated_member_denied",
                    "git_refs_and_registration_unchanged", "git_fsck",
                    "owned_services_reaped", "private_fixture_removed"]
          if not all(report[key] is True for key in checks):
              raise SystemExit("The group invitation rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform",
                    "actual_repositories", "external_github_publication", *checks]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Owning-group invitations\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY

      - name: Reject unsafe service restart after an interrupted command
        run: |
          python3 scripts/execution-crash-rehearsal.py --binary target/debug/gitust --report "$RUNNER_TEMP/gitust-execution-crash.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitust-execution-crash.json").read_text())
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          backend = {"Linux": "linux_bubblewrap", "macOS": "macos_seatbelt"}[os.environ["RUNNER_OS"]]
          if report["source_commit"] != expected or report["runtime_worktree_dirty"] is not False:
              raise SystemExit("The crash rehearsal used a different or dirty source revision")
          if (report["backend"] != backend or report["verification_restored"] is not False
              or report["interrupted_automatic_attempt_replayed"] is not False):
              raise SystemExit("The crash rehearsal has invalid backend or verification evidence")
          if not all(report[key] is True for key in ["passed", "fresh_service_rejected",
                     "explicit_recovery_required", "post_recovery_execution_passed",
                     "automatic_attempt_retained_as_interrupted", "repository_actions_running_and_interrupted"]):
              raise SystemExit("The crash recovery rehearsal is incomplete")
          public = {key: report[key] for key in ["source_commit", "binary_sha256", "platform", "backend",
                    "old_command_survived_sigkill", "fresh_service_rejected", "explicit_recovery_required",
                    "verification_restored", "post_recovery_execution_passed", "git_fsck",
                    "automatic_attempt_retained_as_interrupted", "interrupted_automatic_attempt_replayed",
                    "repository_actions_running_and_interrupted"]}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Execution crash recovery\n\n```json\n" + json.dumps(public, indent=2) + "\n```\n")
          PY
