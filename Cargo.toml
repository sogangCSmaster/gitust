[workspace]
resolver = "2"
members = [
  "crates/gitust-core",
  "crates/gitust-db",
  "crates/gitust-git",
  "crates/gitust-sandbox",
  "crates/gitust-sync",
  "crates/gitust-server",
  "crates/gitust-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Gitust Contributors"]
repository = "https://github.com/sogangCSmaster/gitust"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
gix = { version = "0.70", default-features = false, features = ["max-performance-safe"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22.1"
subtle = "2.6"
parking_lot = "0.12"
tempfile = "3.15"
libc = "0.2"
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
zeroize = "1.8"

# Internal workspace crates
gitust-core = { path = "crates/gitust-core" }
gitust-db = { path = "crates/gitust-db" }
gitust-git = { path = "crates/gitust-git" }
gitust-sandbox = { path = "crates/gitust-sandbox" }
gitust-sync = { path = "crates/gitust-sync" }
gitust-server = { path = "crates/gitust-server" }


